name: E-Commerce CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 2. Build Stage
        run: |
          npm ci
          npm run build

      - name: 3. Automated Testing Stage
        run: npm test

      - name: 4. Code Quality Check
        run: npm run lint

      - name: 5. Deployment Stage
        run: |
          echo "Deploying application to production environment..."
          echo "Deployment successful: Status 200 OK"